name: Build Waris Days APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: waris-days-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v3 can request the retired SDK package "tools" by default.
      # v4 supports current SDK packages; explicitly request only platform-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Verify app source
        run: npm run verify

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Waris-Days-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
